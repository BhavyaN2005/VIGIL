services:
  - type: web
    name: vigil-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r Vigil/Vigil/backend/requirements.txt || pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:create_app --factory --app-dir Vigil/Vigil/backend --host 0.0.0.0 --port $PORT || uvicorn app.main:create_app --factory --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PORT
        value: 10000

