<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone VisionOS Prism Capsule & Liquid Glass Optical Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-color: #05060A;
            --text-color: #F4F4F5;
            --text-muted: #A1A1AA;
            --border-hairline: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient 3D Canvas Background for Optical Warping Demonstration */
        #demo-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Overlay text underneath the lens to demonstrate refractive displacement */
        .backdrop-content {
            position: fixed;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            max-width: 800px;
            padding: 2rem;
        }

        .backdrop-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #A1A1AA;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .backdrop-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #FFFFFF;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .backdrop-desc {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        /* ==========================================================================
           REUSABLE PRISM CAPSULE (CONVEX LIQUID GLASS OPTICAL LENS) COMPONENT
           ========================================================================== */
        .liquid-glass-lens {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(340px, 46vw, 560px);
            height: clamp(170px, 24vh, 270px);
            border-radius: 9999px;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: grab;
            transition: opacity 0.35s ease, border-color 0.35s ease;
            pointer-events: auto;
            backdrop-filter: url(#liquid-convex-lens) blur(1px) saturate(100%);
            -webkit-backdrop-filter: url(#liquid-convex-lens) blur(1px) saturate(100%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 
                0 30px 80px -15px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.6);
        }

        .liquid-glass-lens:active {
            cursor: grabbing;
        }

        .liquid-glass-lens.hidden {
            display: none !important;
        }

        .lens-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: #FFFFFF;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 0.45rem 1.15rem;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            backdrop-filter: blur(12px);
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        /* Instructions HUD */
        .hud-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(10, 12, 18, 0.85);
            border: 1px solid var(--border-hairline);
            border-radius: 999px;
            padding: 0.5rem 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #E4E4E7;
            display: flex;
            align-items: center;
            gap: 1rem;
            backdrop-filter: blur(10px);
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #FFF;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #FFF;
        }
    </style>
</head>
<body>

    <!-- ThreeJS Refraction Background Scene -->
    <canvas id="demo-canvas"></canvas>

    <!-- Underlying Graphic/Content being warped by the lens -->
    <div class="backdrop-content">
        <div class="backdrop-eyebrow">Standalone Component Export</div>
        <h1 class="backdrop-title">PRISM CAPSULE</h1>
        <p class="backdrop-desc">
            VisionOS physical optical convex lens refraction engine.<br>
            Drag this optical capsule across geometric edges to observe real-time background displacement.
        </p>
    </div>

    <!-- REUSABLE COMPONENT: PRISM CAPSULE OPTICAL LENS -->
    <div class="liquid-glass-lens" id="hero-lens" data-name="Prism Capsule" title="Drag to refract background">
        <div class="lens-badge">PRISM CAPSULE &bull; OPTICAL LENS</div>
    </div>

    <!-- HUD Control -->
    <div class="hud-panel">
        <span>Drag the lens or press <strong>[L]</strong> to toggle</span>
        <button class="hud-btn" id="btn-toggle">Toggle Lens</button>
    </div>

    <!-- Reusable Liquid Glass Lens Engine Script -->
    <script>
        /**
         * LiquidGlassEngine v2.1.0
         * Generates dynamic SVG Signed-Distance-Field (SDF) displacement maps on canvas
         * and links GPU-accelerated SVG feDisplacementMap filter for VisionOS glass optics.
         */
        class LiquidGlassEngine {
            constructor(userConfig = {}) {
                this.config = Object.assign({
                    target: '.liquid-glass-lens',
                    filterId: 'liquid-convex-lens',
                    shape: 'capsule',
                    displacementScale: 0.16,
                    bevelRatio: 0.55,
                    blur: 1.0,
                    brightness: 1.0,
                    saturate: 100,
                    draggable: true,
                    interactiveTilt: true
                }, userConfig);

                this.elements = Array.from(document.querySelectorAll(this.config.target));
                if (this.elements.length > 0) {
                    this._buildSVGFilter();
                    if (this.config.draggable) this._initDraggablePhysics();
                }
            }

            _buildSVGFilter() {
                const w = 512, h = 256;
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                const imgData = ctx.createImageData(w, h);
                const data = imgData.data;

                const R = h / 2;
                const B = R * this.config.bevelRatio;

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = (y * w + x) * 4;
                        const cx = Math.max(R, Math.min(x, w - R));
                        const cy = R;
                        const dx = x - cx;
                        const dy = y - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        let red = 128, green = 128;
                        if (dist < R) {
                            const dEdge = R - dist;
                            if (dEdge < B) {
                                const t = dEdge / B;
                                const slope = Math.cos(t * Math.PI * 0.5);
                                const angle = Math.atan2(dy, dx);
                                red = Math.round(128 - Math.cos(angle) * slope * 127);
                                green = Math.round(128 - Math.sin(angle) * slope * 127);
                            }
                        }
                        data[idx] = red;
                        data[idx + 1] = green;
                        data[idx + 2] = 128;
                        data[idx + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                const dataUrl = canvas.toDataURL();
                let svg = document.getElementById('liquid-glass-svg-defs');
                if (!svg) {
                    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.id = 'liquid-glass-svg-defs';
                    svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;';
                    document.body.appendChild(svg);
                }

                const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
                filter.id = this.config.filterId;
                filter.setAttribute('x', '-25%');
                filter.setAttribute('y', '-25%');
                filter.setAttribute('width', '150%');
                filter.setAttribute('height', '150%');
                filter.setAttribute('color-interpolation-filters', 'sRGB');

                const feImage = document.createElementNS('http://www.w3.org/2000/svg', 'feImage');
                feImage.setAttribute('href', dataUrl);
                feImage.setAttribute('result', 'normalMap');

                const feDisp = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
                feDisp.setAttribute('in', 'SourceGraphic');
                feDisp.setAttribute('in2', 'normalMap');
                feDisp.setAttribute('scale', (h * this.config.displacementScale).toString());
                feDisp.setAttribute('xChannelSelector', 'R');
                feDisp.setAttribute('yChannelSelector', 'G');

                filter.appendChild(feImage);
                filter.appendChild(feDisp);
                svg.appendChild(filter);
            }

            _initDraggablePhysics() {
                this.elements.forEach(el => {
                    let isDragging = false;
                    let startX, startY, origLeft, origTop;

                    el.addEventListener('mousedown', (e) => {
                        isDragging = true;
                        el.style.cursor = 'grabbing';
                        startX = e.clientX;
                        startY = e.clientY;
                        const rect = el.getBoundingClientRect();
                        origLeft = rect.left;
                        origTop = rect.top;
                        el.style.transform = 'none';
                        el.style.left = `${origLeft}px`;
                        el.style.top = `${origTop}px`;
                        e.preventDefault();
                    });

                    window.addEventListener('mousemove', (e) => {
                        if (!isDragging) return;
                        const dx = e.clientX - startX;
                        const dy = e.clientY - startY;
                        el.style.left = `${origLeft + dx}px`;
                        el.style.top = `${origTop + dy}px`;
                    });

                    window.addEventListener('mouseup', () => {
                        if (isDragging) {
                            isDragging = false;
                            el.style.cursor = 'grab';
                        }
                    });
                });
            }
        }

        // Initialize Standalone Lens
        window.addEventListener('DOMContentLoaded', () => {
            const lensEngine = new LiquidGlassEngine({
                target: '#hero-lens',
                filterId: 'liquid-convex-lens',
                shape: 'capsule',
                displacementScale: 0.16,
                bevelRatio: 0.55,
                draggable: true
            });

            // Toggle logic
            const lens = document.getElementById('hero-lens');
            const toggleBtn = document.getElementById('btn-toggle');
            function toggle() {
                lens.classList.toggle('hidden');
            }
            if (toggleBtn) toggleBtn.addEventListener('click', toggle);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'l' || e.key === 'L') toggle();
            });

            // Interactive Background WebGL Scene (Grid + Torus Rings)
            const canvas = document.getElementById('demo-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);

            // Wireframe Rings
            const ringGeo = new THREE.TorusGeometry(3.2, 0.04, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, wireframe: true, transparent: true, opacity: 0.4 });
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.rotation.x = Math.PI / 3;
            scene.add(ring1);
            scene.add(ring2);

            // Grid Floor
            const grid = new THREE.GridHelper(30, 30, 0x555555, 0x222222);
            grid.position.y = -3;
            scene.add(grid);

            function animate() {
                requestAnimationFrame(animate);
                ring1.rotation.y += 0.005;
                ring1.rotation.x += 0.003;
                ring2.rotation.y -= 0.004;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
